services:
  - type: web
    name: diu-smart-assistant-api
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt

    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: 3.13

      - key: PROJECT_NAME
        value: DIU Smart Assistant

      - key: VERSION
        value: 1.0.0

      - key: DESCRIPTION
        value: AI-powered University Assistant using Retrieval-Augmented Generation

      - key: HOST
        value: 0.0.0.0

      - key: UPLOAD_DIR
        value: data/uploads

      - key: CHROMA_DB_PATH
        value: data/chroma_db

      - key: LLM_PROVIDER
        value: gemini

      - key: GEMINI_MODEL
        value: gemini-3.5-flash

      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-2

      - key: MODEL_NAME
        value: gemini-3.5-flash

      - key: EMBEDDING_MODEL
        value: gemini-embedding-2

      - key: GEMINI_API_KEY
        sync: false

      - key: TOP_K
        value: 5

      - key: RELEVANCE_THRESHOLD
        value: 0.65

      - key: MAX_CONTEXT_CHARS
        value: 6000

      - key: DEBUG_RETRIEVAL
        value: "false"

      - key: LOG_LEVEL
        value: INFO